# A workload whose CPU profile CHANGES over time, to watch the in-place
# reconciler track it live (resizing the running pod, no restart).
#   HIGH phase ~660m for 3 min  (2s burn / 1s idle)
#   LOW  phase ~200m for 3 min  (1s burn / 4s idle)
# No resource limits so in-place request resizing is always valid.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-wave
  namespace: tailor-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: cpu-wave }
  template:
    metadata:
      labels: { app: cpu-wave }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                echo "phase=HIGH"; t=$(( $(date +%s) + 180 ))
                while [ $(date +%s) -lt $t ]; do timeout -s KILL 2 yes > /dev/null; sleep 1; done
                echo "phase=LOW"; t=$(( $(date +%s) + 180 ))
                while [ $(date +%s) -lt $t ]; do timeout -s KILL 1 yes > /dev/null; sleep 4; done
              done
          resources:
            requests:
              cpu: "1000m"
              memory: 32Mi
