# A workload that actually burns CPU, deterministically: ~1/3 of a core.
# It runs `yes` (pegs a core) 1s on / 2s off, averaging ~330m.
# Requested at 1000m (wrong, over-provisioned) so the recommender — measuring
# the REAL ~330m usage — should recommend ~380m (330m x 1.15 margin) and the
# webhook-mutated pod must keep running healthy at that size.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-burner
  namespace: tailor-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: cpu-burner }
  template:
    metadata:
      labels: { app: cpu-burner }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          # timeout -s KILL guarantees the burst is killed (busybox `kill` alone
          # was unreliable and let `yes` processes accumulate to a full core).
          # 1s burn / 2s idle => ~330m steady.
          args:
            - "while true; do timeout -s KILL 1 yes > /dev/null; sleep 2; done"
          resources:
            requests:
              cpu: "1000m"
              memory: 64Mi
            limits:
              memory: 64Mi
