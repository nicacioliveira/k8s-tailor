# ONE ExternalSecret maps the whole `k8s-tailor` secret-manager entry at once
# (dataFrom.extract) into a k8s Secret exposing mcp-token (the MCP Bearer),
# api-token (the engine write-API Bearer, also forwarded by the MCP) and
# clickhouse-password (read by both the bundled ClickHouse and the engine).
# Create the SM secret first (three independent random values, e.g. openssl rand -hex 32):
#   k8s-tailor -> { "mcp-token": "...", "api-token": "...", "clickhouse-password": "..." }
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: k8s-tailor
  namespace: k8s-tailor
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: k8s-tailor
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: k8s-tailor
