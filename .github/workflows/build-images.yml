name: Build images

# Builds and publishes both container images to GHCR:
#   ghcr.io/<owner>/k8s-tailor       (engine — Go + embedded UI)
#   ghcr.io/<owner>/k8s-tailor-mcp   (MCP server + React dashboard)
# and, for a release, the Helm chart (oci://ghcr.io/<owner>/k8s-tailor/charts).
#
# A RELEASE is the git tag v<appVersion> (chart/Chart.yaml): the chart's default
# image tag is exactly that, so the tag, the images and the chart agree.
#   git tag v0.1.0 && git push origin v0.1.0
# or, without a tag: Actions -> Build images -> Run workflow, version=v0.1.0
#   gh workflow run build-images.yml -f version=v0.1.0
# (workflow_dispatch only exists once this file is on the default branch).
#
# Visibility: packages pushed from a PRIVATE repository are private, so anonymous
# pulls answer "denied". Either make each package public (GitHub -> Packages ->
# k8s-tailor / k8s-tailor-mcp -> Package settings -> Change visibility) or give the
# cluster a pull secret (chart value global.imagePullSecrets). See docs/UPGRADE.md.
#
# Runs ONLY on version tags or manually — never on every push (multi-arch builds
# are slow). PRs/pushes are covered by ci.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish (v<appVersion>, e.g. v0.1.0). Empty = only sha-<commit> images, no chart."
        required: false
        default: ""

concurrency:
  group: build-images-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # Resolves the release version (tag push or dispatch input) and refuses one that
  # does not match chart/Chart.yaml appVersion — the chart would otherwise point
  # at images that were never built.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then V="$GITHUB_REF_NAME"; else V="$INPUT"; fi
          if [ -n "$V" ]; then
            case "$V" in v[0-9]*) ;; *) echo "::error::version must look like v1.2.3 (got '$V')"; exit 1 ;; esac
            APP=$(awk -F'"' '/^appVersion:/ {print $2}' chart/Chart.yaml)
            if [ "$V" != "v$APP" ]; then
              echo "::error::version $V does not match chart/Chart.yaml appVersion $APP (the chart defaults to image tag v$APP). Bump appVersion or tag v$APP."
              exit 1
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  images:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io/<owner>/* with GITHUB_TOKEN
    strategy:
      matrix:
        include:
          - name: k8s-tailor
            context: .
            dockerfile: Dockerfile
          - name: k8s-tailor-mcp
            context: ./mcp
            dockerfile: ./mcp/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          # org.opencontainers.image.source (set by this action) links the package
          # to this repository.
          tags: |
            type=sha,format=long
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.version != '' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.version != '' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4 # arm64 emulation for multi-arch build

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # Multi-arch: arm64 nodes (e.g. Graviton) as well as amd64. An amd64-only
          # image fails to pull on arm64 with "no match for platform in manifest".
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Publish the Helm chart to GHCR OCI for a release, so GitOps tools can reference
  # the PACKAGED chart (oci://ghcr.io/<owner>/k8s-tailor/charts) instead of
  # vendoring an unpacked copy. Chart version = chart/Chart.yaml version (not the
  # tag): pushing the same chart version twice is refused by the registry.
  chart:
    needs: [version, images]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v5

      - name: Log in to GHCR (Helm OCI)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Package + push chart
        run: |
          # dependency build needs the subchart repo registered first.
          helm repo add victoria-metrics https://victoriametrics.github.io/helm-charts
          helm repo update
          helm dependency build chart
          helm lint --strict chart
          helm package chart
          VER=$(awk '/^version:/ {print $2}' chart/Chart.yaml)
          helm push "k8s-tailor-${VER}.tgz" "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/k8s-tailor/charts"
