name: Pages

# Builds the public site (landing page in site/, documentation from docs/ with MkDocs Material) and
# publishes it to GitHub Pages: https://nicacioliveira.github.io/k8s-tailor/ and /docs/.
# One-time setup: Settings > Pages > Source = "GitHub Actions" (or `gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow`).
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "mkdocs.yml"
      - "llms.txt"
      - "llms-full.txt"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt
      - run: pip install -r site/requirements.txt
      # --strict inside build.sh: a broken link or anchor in the docs fails the build.
      - run: site/build.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
