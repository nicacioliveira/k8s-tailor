# Base workloads for dev/istio/mesh-test.sh. Namespace mesh-demo has Istio injection on.
apiVersion: v1
kind: Namespace
metadata:
  name: mesh-demo
  labels: { istio-injection: enabled }
---
apiVersion: tailor.k8s-tailor.dev/v1alpha1
kind: TailorPolicy
metadata: { name: mesh-demo }
spec:
  priority: 200
  mode: InPlace
  selector: { namespaces: ["mesh-demo"] }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: mesh-demo }
spec:
  selector: { app: web }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: mesh-demo }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          # httpd + ~11% CPU burner (the app is over-requested on purpose).
          command: ["sh", "-c", "mkdir -p /www && echo hello-from-$HOSTNAME > /www/index.html; httpd -f -p 8080 -h /www & while true; do timeout -s KILL 1 yes > /dev/null; sleep 8; done"]
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 500m, memory: 64Mi }
            limits: { memory: 128Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: client, namespace: mesh-demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: client } }
  template:
    metadata: { labels: { app: client } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          # steady traffic through the mesh so the proxies have measurable usage
          command: ["sh", "-c", "while true; do wget -q -T 2 -O- http://web:8080 >/dev/null 2>&1; sleep 0.05; done"]
          resources:
            requests: { cpu: 200m, memory: 32Mi }
            limits: { memory: 64Mi }
