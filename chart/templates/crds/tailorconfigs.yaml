{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  {{- include "tailor.crd.meta" . | nindent 2 }}
  name: tailorconfigs.tailor.k8s-tailor.dev
spec:
  group: tailor.k8s-tailor.dev
  scope: Cluster
  names:
    kind: TailorConfig
    listKind: TailorConfigList
    plural: tailorconfigs
    singular: tailorconfig
    shortNames: ["rscfg"]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: Global tailor config. The singleton named "cluster" is authoritative.
              properties:
                paused:
                  type: boolean
                  default: false
                  description: Kill switch — when true, no actuation happens anywhere.
                defaultMode:
                  type: string
                  enum: ["Off", "Recommend", "Webhook", "InPlace", "Both"]
                  default: Recommend
                  description: Mode for workloads no policy matches.
                observedKinds:
                  type: array
                  items: { type: string, enum: ["Deployment", "StatefulSet", "DaemonSet", "Pod"] }
                  description: Which workload kinds the tailor observes. Seeded on install; edit to narrow scope.
                excludeNamespaces:
                  type: array
                  items: { type: string }
                  description: Namespaces the tailor never observes or actuates.
                observeSelector:
                  type: object
                  additionalProperties: { type: string }
                  description: Only observe workloads whose labels match ALL of these (empty = all). e.g. tailor=on.
                sidecarNames:
                  type: array
                  items: { type: string }
                  description: Extra container-name globs classified as injected sidecars (added to the built-in list istio-proxy, linkerd-proxy, envoy, vault-agent, cloud-sql-proxy, queue-proxy, datadog-agent, otc-container, ...). Injected sidecars are only recommended until a policy/annotation opts them in.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Paused
          type: boolean
          jsonPath: .spec.paused
        - name: DefaultMode
          type: string
          jsonPath: .spec.defaultMode
{{- end }}
